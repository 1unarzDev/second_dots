[[mgr.prepend_keymap]]
on = [ "M" ]
run = "plugin mount"
desc = "Mount manager"

[[mgr.prepend_keymap]]
on = [ "<C-n>" ]
run = 'shell -- dragon-drop -x -i -T %s'
desc = "Drag selected files with dragon-drop"

[[mgr.prepend_keymap]]
on = [ "<C-o>" ]
run = "open --interactive"
desc = "Choose an application"
